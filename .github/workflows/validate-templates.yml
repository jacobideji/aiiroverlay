name: Validate templates against schemas

on:
  pull_request:
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/validate.py"
      - "scripts/check_repo.py"
      - "tests/**"
      - ".github/workflows/validate-templates.yml"
  push:
    branches:
      - main
    paths:
      - "templates/**"
      - "schemas/**"
      - "scripts/validate.py"
      - "scripts/check_repo.py"
      - "tests/**"
      - ".github/workflows/validate-templates.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate AI-BOM + Privilege Matrix against JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Run repository consistency checks
        run: python3 scripts/check_repo.py

      - name: Run reference validator
        run: python3 scripts/validate.py

      - name: Run staleness regression tests
        run: python3 -m unittest discover -s tests -v
